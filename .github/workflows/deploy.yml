
name: TradeClub Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradeclub-production
  cancel-in-progress: false

jobs:

  # ==========================================
  # JOB 1: BUILD AND PUSH DOCKER IMAGE
  # ==========================================

  build-and-push:

    name: Build and Push Docker Image

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify Build
        run: test -f dist/app.js

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/asheemrahman/tradeclub-backend:latest
            ghcr.io/asheemrahman/tradeclub-backend:${{ github.sha }}

  # ==========================================
  # JOB 2: DEPLOY TO AWS EC2
  # ==========================================

  deploy:

    name: Deploy to AWS EC2

    needs: build-and-push

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      
      - name: Inspect GitHub OIDC SSL Certificate
        shell: bash
        run: |
          set -euo pipefail

          CERT_DIR=$(mktemp -d)

          openssl s_client \
            -servername token.actions.githubusercontent.com \
            -connect token.actions.githubusercontent.com:443 \
            -showcerts </dev/null 2>/dev/null |
          awk -v dir="$CERT_DIR" '
            /BEGIN CERTIFICATE/ {
              n++
              file=sprintf("%s/cert-%02d.pem",dir,n)
            }
            file {
              print > file
            }
            /END CERTIFICATE/ {
              close(file)
              file=""
            }
          '

          for cert in "$CERT_DIR"/*.pem; do
            echo "========== CERTIFICATE =========="
            openssl x509 -in "$cert" \
              -noout -subject -issuer -fingerprint -sha1
          done


      # ------------------------------------------
      # STEP 2: CONFIGURE AWS CREDENTIALS
      # ------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          output-env-credentials: true

      # ------------------------------------------
      # STEP 3: DEPLOY USING AWS SSM
      # ------------------------------------------

      - name: Deploy Using SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}

        shell: bash

        run: |

          set -euo pipefail

          if [ -z "$EC2_INSTANCE_ID" ]; then
            echo "EC2_INSTANCE_ID is missing"
            exit 1
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "TradeClub deployment $IMAGE_TAG" \
            --parameters "{\"commands\":[\"sudo /opt/tradeclub/deploy.sh $IMAGE_TAG\"]}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command: $COMMAND_ID"

          for i in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text

              exit 0

            fi

            if [[ "$STATUS" == "Failed" ||
                  "$STATUS" == "TimedOut" ||
                  "$STATUS" == "Cancelled" ]]; then

              echo "Deployment failed!"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text || true

              exit 1

            fi

            sleep 5

          done

          echo "Deployment polling timed out"
          exit 1
