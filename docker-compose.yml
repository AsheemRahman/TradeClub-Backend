
services:
  backend:
    image: ghcr.io/asheemrahman/tradeclub-backend:${IMAGE_TAG:-latest}

    container_name: tradeclub-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 5000

    ports:
      - "127.0.0.1:5000:5000"

    init: true

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
